services:
  postgres:
    image: postgres:17-alpine
    container_name: biblio-postgres
    environment:
      POSTGRES_DB: biblio
      POSTGRES_USER: biblio
      POSTGRES_PASSWORD: biblio
    ports:
      - "5432:5432"
    volumes:
      - biblio-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblio"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./Backend
    container_name: biblio-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: biblio
      DB_USER: biblio
      DB_PASSWORD: biblio
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  biblio-data:
