spring.application.name=backend

# Base de donnees de la bibliotheque : elle porte les donnees metier
# (statut LIBRE / RESERVE et date de disponibilite). Open Library ne fournit
# que les informations descriptives des livres.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:biblio}
spring.datasource.username=${DB_USER:biblio}
spring.datasource.password=${DB_PASSWORD:biblio}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Les scripts SQL ne sont charges automatiquement que pour les bases embarquees :
# on les active explicitement pour PostgreSQL.
spring.sql.init.mode=always

server.port=8080

# Integration Open Library (informations descriptives uniquement).
openlibrary.base-url=https://openlibrary.org
openlibrary.page-size=100
# L'API met 5 a 10 s pour repondre : 2 pages suffisent a disposer de plus de
# 100 livres diversifies (auteurs et titres tous differents).
openlibrary.max-pages=2

# Nombre de livres conserves apres diversification du catalogue.
catalogue.taille=100
# Duree de conservation du catalogue en memoire : evite de recontacter
# Open Library a chaque changement de page ou de filtre.
catalogue.cache-duree-secondes=300

# Pagination de la page d'accueil : 25 livres par page, soit 4 pages.
livres.taille-page=25

spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=30s

# Authentification : jeton signe en HMAC-SHA256 (32 caracteres minimum).
# EN PRODUCTION, definir JWT_SECRET avec une valeur secrete longue et aleatoire :
# la valeur par defaut ci-dessous ne sert qu'au developpement local.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.duree-heures=24
